# =============================================================================
# inventotrackV2 - Docker Compose PRODUCTION
# PostgreSQL + Django/Gunicorn + Vue (built static) + Nginx reverse proxy
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: ams_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: -E UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ams_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Django Application (Gunicorn)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ams_django
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ams_postgres
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.prod
      PYTHONUNBUFFERED: "1"
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    networks:
      - ams_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/\")'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (serves frontend + proxies API)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ams_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - ams_network

  # ---------------------------------------------------------------------------
  # Frontend Builder (build-only, exits after producing dist/)
  # ---------------------------------------------------------------------------
  frontend-builder:
    build:
      context: ./AMS-FRONT
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    container_name: ams_frontend_builder
    volumes:
      - frontend_dist:/app/dist

networks:
  ams_network:
    driver: bridge

volumes:
  postgres_data:
  static_files:
  media_files:
  frontend_dist:
